[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd"
version = "0.1.0"
description = "A tiny scalar-valued autograd engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "graphviz>=0.20",
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.9",
    "numpy>=2",
    "pytest>=8",
    "scikit-learn>=1.5",
    "torch>=2.5",
]

[tool.setuptools.packages.find]
include = ["micrograd*"]
